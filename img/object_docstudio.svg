<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- DocStudio: three documents (spreadsheet, text, PDF) fanned out, and a stylus for the editing -->
  <g stroke-linejoin="round" transform="translate(3 5) scale(0.86)">
    <!-- Spreadsheet, back left -->
    <g transform="rotate(-12 16 40)">
      <rect x="5" y="14" width="22" height="30" rx="2.5" fill="#ffffff" stroke="#1e7b45" stroke-width="2.4"/>
      <rect x="8" y="21" width="16" height="16" fill="#1e7b45" opacity="0.15"/>
      <path d="M8 26.3h16M8 31.6h16M13.3 21v16M18.6 21v16" stroke="#1e7b45" stroke-width="1.6"/>
    </g>
    <!-- Text document, back right -->
    <g transform="rotate(10 46 38)">
      <rect x="35" y="13" width="22" height="30" rx="2.5" fill="#ffffff" stroke="#2b5797" stroke-width="2.4"/>
      <path d="M39 20h14M39 25h14M39 30h14M39 35h9" stroke="#2b5797" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- PDF, front centre -->
    <path d="M21 9h16l7 7v32a2.5 2.5 0 0 1-2.5 2.5h-20.5a2.5 2.5 0 0 1-2.5-2.5v-36.5a2.5 2.5 0 0 1 2.5-2.5z" fill="#ffffff" stroke="#c62828" stroke-width="2.4"/>
    <path d="M37 9v7h7" fill="none" stroke="#c62828" stroke-width="2.2"/>
    <rect x="21.5" y="22" width="19" height="9" rx="1.5" fill="#c62828"/>
    <text x="31" y="29.2" font-family="Arial, Helvetica, sans-serif" font-size="7.4" font-weight="700" fill="#ffffff" text-anchor="middle">PDF</text>
    <path d="M23 36h16M23 41h11" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Stylus, writing on the bottom right of the PDF -->
  <g transform="rotate(35 50 40)">
    <rect x="46.5" y="22" width="7" height="22" rx="2" fill="#f2a900" stroke="#5b4300" stroke-width="1.6"/>
    <rect x="46.5" y="22" width="7" height="5" rx="2" fill="#5b4300"/>
    <path d="M46.5 44l3.5 8 3.5-8z" fill="#f6dfb0" stroke="#5b4300" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M49 49.8l1 2.2 1-2.2z" fill="#263238"/>
  </g>
</svg>
