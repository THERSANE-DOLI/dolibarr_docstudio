# GitHub release with the module zip, installable from Dolibarr (Setup > Modules > Deploy an external module).
# Work goes on develop; a version is published by pushing it on stable (git push origin develop:stable): tag vX.Y.Z,
# release marked Latest, branch X.Y moved on it. A fix of an older series goes on its branch X.Y (release not
# marked Latest), then X.Y is merged into develop. Details in .github/release.sh.
# Can be run by hand (Actions > release > Run workflow) on stable or on a branch X.Y.
# Stable links: .../releases/latest (page of the last release),
# .../releases/download/vX.Y.Z/module_docstudio-X.Y.Z.zip (zip of a given version).
name: release

on:
  push:
    branches: ['stable', '[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MODULE: docstudio
      DESCRIPTOR: core/modules/modDocStudio.class.php
      TITLE: DocStudio
    steps:
      - name: Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag, zip, release and branch X.Y
        run: bash .github/release.sh
