# Euro-Office Docs, office server of DocStudio (WOPI)
#
# Start:   cp .env.example .env  (then set JWT_SECRET)  &&  docker compose up -d
# Logs:    docker compose logs -f
# Update:  change the digest of the image, then  docker compose pull && docker compose up -d
#
# The container only listens on 127.0.0.1: publish it in HTTPS on its own subdomain through the reverse proxy of the
# web server (see the README of DocStudio, « Office server in production »).

name: docstudio-eurooffice

services:
  documentserver:
    # Euro-Office only publishes the tag latest: the image is pinned by its digest, tested with DocStudio
    image: ghcr.io/euro-office/documentserver@sha256:2fadc1b3dc99250d6576fc0c0f34349db6725b752b08e91db9831fbb803fc5c2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EO_PORT:-9982}:80"
    environment:
      WOPI_ENABLED: "true"
      # JWT protects the API of the document server outside of WOPI (WOPI calls are signed by the proof keys)
      JWT_ENABLED: "true"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      # Files of 100 MB at most (default of the server)
      MAX_FILE_SIZE: "${EO_MAX_FILE_SIZE:-104857600}"
    volumes:
      # Folder next to this file (outside of the web root): keys of WOPI (proof keys) and secrets kept across restarts
      # and updates (else Dolibarr refuses the calls), and saved with the backups of the server. The container sets
      # its owner itself. No folder for the logs: an empty folder on /var/log/euro-office stops nginx, read them with
      # docker compose logs.
      - ./dockerdata/Data:/var/www/euro-office/Data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -q true"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
