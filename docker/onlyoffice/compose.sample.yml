# ONLYOFFICE Docs (Community Edition), office server of DocStudio (WOPI)
#
# SAMPLE: copy it to compose.yml and adapt it. Read README.md of this folder first: the values below are examples, to
# adapt to your server.
#
# Start:   cp compose.sample.yml compose.yml  &&  cp .env.example .env  (then set JWT_SECRET)  &&  docker compose up -d
# Logs:    docker compose logs -f
# Update:  change the digest of the image, then  docker compose pull && docker compose up -d
#
# The container only listens on 127.0.0.1: publish it in HTTPS on its own subdomain through the reverse proxy of the
# web server.

name: docstudio-onlyoffice

services:
  documentserver:
    # ONLYOFFICE Docs pinned by its digest, tested with DocStudio
    image: onlyoffice/documentserver@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OO_PORT:-9981}:80"
    environment:
      WOPI_ENABLED: "true"
      # JWT protects the API of the document server outside of WOPI (WOPI calls are signed by the proof keys)
      JWT_ENABLED: "true"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
    volumes:
      # Folder next to this file (outside of the web root): keys of WOPI (proof keys) and secrets kept across restarts
      # and updates (else Dolibarr refuses the calls). The container sets its owner itself. No folder for the logs:
      # read them with docker compose logs.
      - ./Data:/var/www/onlyoffice/Data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -q true"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

# Fixed network: the container calls Dolibarr from an address of this range (when both are on the same server), the
# one to allow in Dolibarr. EXAMPLE: choose a range free on your server (docker network ls, ip route).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.2.0/24
